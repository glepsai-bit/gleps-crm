<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Dumbbell icon -->
  <g transform="translate(0, 4)">
    <!-- Left weight -->
    <rect x="2" y="10" width="8" height="20" rx="2" fill="currentColor"/>
    <!-- Left bar connector -->
    <rect x="10" y="16" width="6" height="8" rx="1" fill="currentColor" opacity="0.7"/>
    <!-- Center bar -->
    <rect x="16" y="18" width="20" height="4" rx="1" fill="currentColor"/>
    <!-- Right bar connector -->
    <rect x="36" y="16" width="6" height="8" rx="1" fill="currentColor" opacity="0.7"/>
    <!-- Right weight -->
    <rect x="42" y="10" width="8" height="20" rx="2" fill="currentColor"/>
  </g>
  <!-- FitPark wordmark -->
  <text x="60" y="34" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="currentColor" letter-spacing="-0.5">FitPark</text>
</svg>
