name: Tests

on:
  pull_request:
  push:
    branches: [main, Variação-FitPark, whitelabel/gleps-ia]

jobs:
  backend-tests:
    name: Backend (vitest + Prisma)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gleps_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gleps_crm_test
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-com-pelo-menos-32-caracteres-aaaa
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret-com-32-caracteres-bbbb
      FRONTEND_URL: http://localhost:8081

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply migrations to test DB
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run vitest
        working-directory: backend
        run: npm test

  frontend-tests:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Run vitest
        run: bun run test
