# GoodLeads Flow Builder — nginx config customizado.
# Headers de seguranca pq a pagina recebe tokens sensiveis nos campos do form.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip pros arquivos texto (HTML/CSS/JS/JSON)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Headers de seguranca
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP restritiva: nada de origem externa, nem inline scripts.
    # 'unsafe-inline' so em style por causa do <style> opcional no HTML.
    # connect-src 'self' so — JS local, sem fetch a host externo (todo processamento client-side).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none';" always;

    # Cache agressivo pros assets versionados (raramente mudam — invalidar via rebuild de imagem)
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Healthcheck pro EasyPanel/Traefik
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback (no caso, single page)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
